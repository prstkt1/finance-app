<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="author" content="Nikita" />
    <meta
      name="description"
      content="Web application for financial management"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finance App</title>
    <link rel="icon" type="images/x-icon" href="favicon/diagram_white.ico" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="./index.js"></script>
  </head>
  <body>
    <div id="better_alert" class="hidden"></div>
    <header class="header">
      <div class="logo">Finance App</div>

      <div class="login-button" id="login-button">
        <button class="btn" id="openLoginBtn">Log In</button>
      </div>
      <div class="logout-button" id="logout-button" style="display: none">
        <button class="btn" id="logoutBtn">Log Out</button>
      </div>
    </header>
    <div class="log-in" id="log-in">
      <form action="#" class="login-content">
        <span class="close" id="closeLogin">&times;</span>
        <div class="container">
          <h1>Log In</h1>
          <hr />
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
            autocomplete="off"
          />
          <label for="pass">Password</label>
          <input
            type="password"
            id="pass"
            name="pass"
            placeholder="Enter your password"
            required
            autocomplete="off"
          />
          <label>
            <input type="checkbox" id="remember" checked />
            Remember me
          </label>
          <p>
            Creating an account, you agree to our
            <a href="#">Terms and Privacy Policy</a>
          </p>
          <div class="buttons">
            <button type="button" class="loginBtn" id="loginBtn">Log in</button>
            <button type="button" class="registerBtn" id="registerBtn">
              Register
            </button>
          </div>
        </div>
      </form>
    </div>
    <div class="total">
      <h2>Total Expenses:</h2>
      <h3 id="total">0</h3>
    </div>
    <div class="month-navigation">
      <button id="prev-month">&lt;</button>
      <span id="month-name" class="month-name"></span>
      <button id="next-month">&gt;</button>
    </div>
    <div class="main-container">
      <div class="expenses-container">
        <h2>Your Expenses</h2>
        <ul id="expenses"></ul>
        <button id="toggle-add-expense" class="add-expense-btn">
          Add New Expense
        </button>
        <div class="clear">
          <button type="button" class="clearBtn" id="clearAllBtn">
            Clear All
          </button>
        </div>
      </div>
      <div class="right-container">
        <canvas id="expenseChart"></canvas>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
      </div>
    </div>

    <div class="add-expense" id="add-expense">
      <span class="close" id="closeAddExpense">&times;</span>
      <h2>Add New Expense</h2>
      <form action="#" id="form">
        <label for="name">Name</label>
        <input
          list="customSelect"
          type="text"
          id="customInput"
          name="name"
          placeholder="Enter the name of the expense"
          required
          autocomplete="off"
        />
        <datalist id="customSelect">
          <option value="Option 1"></option>
          <option value="Option 2"></option>
          <option value="Option 3"></option>
        </datalist>

        <label for="amount">Amount</label>
        <input
          type="number"
          id="amount"
          name="amount"
          placeholder="Enter the amount of the expense"
          required
          autocomplete="off"
        />
        <button type="button" class="addBtn" id="addExpenseBtn">Add</button>
      </form>
    </div>
  </body>
</html>
